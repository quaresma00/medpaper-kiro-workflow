# ==============================================================================
# Reporting-guideline item registry, read by the reporting_checklist_complete gate
# (S06 early warning, S23/S24/S25 blocking) and by the S23 card.
# ==============================================================================
# Item IDs and short neutral topic titles only - use the official checklist for the wording.
# verify = true means the item list is NOT shipped (never invented): a protocol naming that
# guideline fails until the list is populated from `source` in the engine workspace.
# case_sensitive = true: the guideline's aliases are ordinary English words, so prose
# detection matches only the given case (explicit `Guideline:` lines are always casefolded).
# ==============================================================================

