# ==============================================================================
# Skill arbitration policy
# ==============================================================================
# A general medical-research skill suite may be installed at the user level. Some of its
# skills strengthen this pipeline; others quietly replace a stage and leave its gate
# unsatisfiable. This file decides which is which, and tools/hooks/skill_guard.py enforces it.
#
# The test applied throughout:
#   Does the skill produce an artifact that a stage DECLARES as its output?
#     -> blocked, unless its output lands at the declared path and passes that gate.
#   Does it produce analysis, a review, or something the pipeline does not cover?
#     -> allow.
#   Does it produce a declared artifact but is genuinely useful as a helper inside a stage?
#     -> gated: ask first, so the operator confirms the output still lands correctly.
#
# verdict:
#   blocked  the guard refuses activation and prints the pipeline route instead
#   gated    the guard asks for confirmation, quoting where it may legitimately be used
#   allow    no interference
#
# Anything not listed here is allowed. Edit this file, not the guard.
# ==============================================================================

[meta]
version = "2.0.0"
default = "allow"

# ==============================================================================
# Capability arbitration
# ==============================================================================
# Skills are not the only thing that can wander off the pipeline. Any capability the host
# offers - a skill, an MCP server, a plugin, an image generator, a web browser - has to fit
# the same contract, so the rules are stated once here rather than per skill.
#
# 1. The pipeline is the sole workflow orchestrator. Stage order, gate state and the handoff
#    log live in papers/<slug>/.wf/ and are changed only through tools/wf.py. A capability may
#    produce an artifact inside a stage; it may never decide what happens next.
#
# 2. Any capability that writes an artifact a stage declares must be registered in this file
#    with a verdict before it is used. An unregistered capability that writes to a declared
#    output path is indistinguishable from drift, and the gate will read its output as
#    unexplained. `python tools/hooks/skill_guard.py --audit` lists what is registered.
#
# 3. Image generation and multimodal editing are review-only for scientific figures. Such a
#    capability may act as a second visual critic on a rendered PNG - describing what it sees,
#    flagging unreadable labels, poor contrast, or a misleading axis. It must not redraw,
#    inpaint, upscale, restyle or otherwise regenerate a figure that carries data. A generated
#    or edited plot no longer corresponds to 03_analysis/results/*.json, which makes it
#    fabricated data wearing the shape of a chart. Fix the plotting script and re-render.
#
# 4. Nothing containing patient-level, private or credential data may be sent to an external
#    capability without explicit user authorization, whatever its stated retention policy.
#
# 5. A capability that cannot show its work does not satisfy a gate. Retrieval must leave a
#    cached payload; a statistic must land in a results JSON; a visual check must name what
#    was seen. "The tool said so" is not evidence.
#
# 6. Where two figure authorities disagree, the one a gate can measure wins. See
#    [figure_authority] below. A standards document can assert a number; only the pipeline's
#    own style module and qc.py can make the render actually carry it.
# ==============================================================================

# ==============================================================================
# Figure authority: medical-sci-figure-skill vs tools/figures/
# ==============================================================================
# `medical-sci-figure-skill` is installed at the user level and is the figure standard for
# ad-hoc plotting outside this pipeline. Inside the pipeline the two overlap, and on several
# numbers they disagree outright. Split by what is verifiable:
#
#   The SKILL is the authority on visual grammar - which archetype a chart is, what elements
#   that archetype must carry, what is forbidden (dynamite plots, a box plot at n<=5, a KM
#   curve with no risk table, "400x" written in a caption instead of an overlaid scale bar),
#   journal palette choice, and the GraphPad-Prism aesthetic for wet-lab panels, which this
#   pipeline has no equivalent of. Read references/figure_atlas.md and
#   references/universal_laws.md at S11 for the chart type in hand.
#
#   THIS PIPELINE is the authority on everything a gate measures: physical widths, the font
#   and line-width floors, effective dpi, output paths, the save mechanism, the sidecar that
#   artist-level QC reads, and archetype element detection. tools/figures/style.py renders and
#   tools/figures/qc.py judges - always, in both visual_review_mode settings.
#
# The pipeline already absorbed this skill's archetype taxonomy, its glyph-warning capture and
# its tick-collision test; reference/figure-standards.md and reference/archetypes.toml credit
# it. What follows is where they still conflict, resolved once so nobody rediscovers it midway
# through a figure.
# ==============================================================================

[figure_authority]
skill = "medical-sci-figure-skill"
renders_with = "tools/figures/style.py"
judged_by = "tools/figures/qc.py"

# Conflicts, and which side governs. `resolution` is what the agent must actually do.
[[figure_authority.conflict]]
item = "single-column width"
skill_says = "85 mm"
pipeline_says = "90 mm (targets.column_width_mm_single)"
governs = "pipeline"
resolution = """Both are real journal values; the honest answer is that it is journal-specific.
Keep 90/180 as the default and override from the S20 guideline extract when the chosen journal
states otherwise: `wf config set column_width_mm_single 85`. Designing at 85 mm while qc.py
measures effective dpi against 90 mm understates resolution by about 6 percent, which can flip
a 300 dpi pass into a fail for no real reason."""

[[figure_authority.conflict]]
item = "double-column width"
skill_says = "175 mm"
pipeline_says = "180 mm (targets.column_width_mm_double)"
governs = "pipeline"
resolution = "Same as single column: override per journal at S20, do not hand-edit the script."

[[figure_authority.conflict]]
item = "minimum font size"
skill_says = "5.0 pt floor"
pipeline_says = "6.0 pt floor (targets.figure_font_pt_min)"
governs = "pipeline"
resolution = """The stricter floor wins. 5 pt is below the stated minimum of most medical
publishers, and text that small does not survive CMYK print. Never shrink type to win space -
change the gridspec ratios or the panel composition."""

[[figure_authority.conflict]]
item = "legend placement"
skill_says = "outside the canvas via bbox_to_anchor=(1.02, 1.0)"
pipeline_says = "its own axes-free SubFigure row"
governs = "pipeline"
resolution = """A bbox_to_anchor legend hangs outside its panel's rectangle, which is exactly
what qc.py's panel tight-bbox overlap and interior-void checks flag - it lands in a sibling
panel's space. Panel-first composition (figure-standards.md section 4) is not optional here."""

[[figure_authority.conflict]]
item = "figure and axes titles"
skill_says = "ax.set_title and fig.suptitle both banned outright"
pipeline_says = "no narrative titles; a short panel title via sf.suptitle is allowed"
governs = "pipeline"
resolution = """Agreement on substance - no narrative or explanatory text inside a panel, which
is invariant 8. They differ only on a short panel identifier, which the pipeline puts on the
SubFigure so it spans the panel instead of starting after the y-axis decorations. Consequence:
do not run the skill's audit_medical_figure() on a pipeline figure, it reports that suptitle as
a critical failure."""

[[figure_authority.conflict]]
item = "the QA engine"
skill_says = "medfigure.qa.audit_medical_figure(fig) -> bool"
pipeline_says = "tools/figures/qc.py, writing 05_figures/qc/qc_report.json"
governs = "pipeline"
resolution = """The skill's audit is a strict subset: glyphs, tick collisions, font floor, bar
baseline, internal titles. qc.py does all of those plus effective dpi, content bbox and margin
asymmetry, edge clipping, grey-text regions, panel overlap, dead bands, and per-archetype
element detection - and it leaves a report the S11 gate reads. A boolean return satisfies no
gate. Run qc.py; do not run both."""


# ------------------------------------------------------------------------------
# BLOCKED - replaces a stage, writes elsewhere, gate can never go green
# ------------------------------------------------------------------------------

[[skill]]
name = "write-paper"
verdict = "blocked"
replaced_by = "S08 Methods, S09 Results, S14 Introduction, S16 Discussion"
reason = """A competing 8-phase IMRAD workflow that drafts whole manuscripts with no gates.
It writes several sections at once, which violates the one-section-per-stage rule, and its
numbers carry no results-JSON provenance."""

[[skill]]
name = "orchestrate"
verdict = "blocked"
replaced_by = "python tools/wf.py status"
reason = """A router. It decides which skill handles an ambiguous research request, which is
exactly the decision the stage card already makes. Letting it route sends the work around the
pipeline instead of through it - the single most likely way to drift."""

[[skill]]
name = "manage-project"
verdict = "blocked"
replaced_by = "wf init, wf status, wf note, project/.wf/"
reason = """Its own init/status/sync-memory commands maintain a second project state and a
second set of memory files. Two state machines means neither is trustworthy."""

[[skill]]
name = "intake-project"
verdict = "blocked"
replaced_by = "S01 intake"
reason = "Scaffolds a competing project layout and memory files; S01 produces idea.json and notes.md."

[[skill]]
name = "make-figures"
verdict = "blocked"
replaced_by = "S11 + tools/figures/ (style.py, recipes.py, qc.py)"
reason = """Renders to its own paths, produces no qc_report.json, and performs no archetype
element detection. figures_match_plan and figures_qc_pass cannot pass on its output."""

[[skill]]
name = "search-lit"
verdict = "blocked"
replaced_by = "python tools/pubmed/client.py search"
reason = """Runs its own PubMed retrieval. The raw payload never reaches
06_refs/cache/scan_manifest.json, so pubmed_cache_fresh reports that no search was ever run.
The cached payload IS the evidence; a search without one does not count."""

[[skill]]
name = "medsci-lit-api"
verdict = "blocked"
replaced_by = "python tools/pubmed/client.py, tools/pubmed/build_library.py"
reason = "Same as search-lit: a parallel retrieval path that leaves no cached evidence."

[[skill]]
name = "fulltext-retrieval"
verdict = "blocked"
replaced_by = "python tools/pubmed/fulltext.py"
reason = """Fetches PDFs outside 06_refs/fulltext/ and does not record the retrieval route in
deepread_index.json, which deepread_complete requires."""

[[skill]]
name = "fulltext-batch"
verdict = "blocked"
replaced_by = "python tools/pubmed/fulltext.py --all-deepread"
reason = "Same as fulltext-retrieval, at higher volume."

[[skill]]
name = "manage-refs"
verdict = "blocked"
replaced_by = "S13 + tools/pubmed/build_library.py --export"
reason = """Rewrites references, renders citations and can inject Zotero field codes. It does
not write 06_refs/verified.json, so every citekey reads as unverified, and hand-edited
refs.bib breaks bib_ris_match_library."""

[[skill]]
name = "polish-language"
verdict = "blocked"
replaced_by = "S19 + python tools/text/polish.py"
reason = """Edits manuscript prose without taking the pre-polish snapshot, so
polish_preserves_facts has nothing to diff against and cannot prove a number or citation
survived the rewrite."""

[[skill]]
name = "humanize"
verdict = "blocked"
replaced_by = "S19 + python tools/text/polish.py"
reason = "Same as polish-language: rewrites prose with no fact-preservation guarantee."

[[skill]]
name = "academic-aio"
verdict = "blocked"
replaced_by = "S17 front matter, S19 polish"
reason = """Rewrites titles and abstracts for search-engine optimisation. The abstract's
numbers must trace to results JSON and match the Results section exactly; an SEO rewrite
carries no such guarantee."""

[[skill]]
name = "find-journal"
verdict = "blocked"
replaced_by = "S18 journal selection"
reason = """Ranks against a bundled profile library whose impact-factor and APC figures are
point-in-time. S18 requires the live author instructions to be fetched and snapshotted, and
guidelines_sourced checks for that snapshot."""

[[skill]]
name = "sync-submission"
verdict = "blocked"
replaced_by = "S20 bundle assembly"
reason = "Builds a competing submission manifest; bundle_complete checks its own manifest.json."

[[skill]]
name = "write-protocol"
verdict = "blocked"
replaced_by = "S03 protocol v1, S06 protocol final"
reason = """Produces a different protocol structure. The gate checks for specific headings,
including 'Deviations from protocol v1', which is what keeps a retrofitted protocol honest."""

[[skill]]
name = "analyze-stats"
verdict = "blocked"
replaced_by = "S05 exploratory analysis"
reason = """Generates analysis code with no results-JSON dump contract. Every downstream
number then fails numbers_have_provenance, and it also produces figures, which S05 forbids."""

[[skill]]
name = "meta-analysis"
verdict = "blocked"
replaced_by = "S01-S20, with design = meta-analysis"
reason = """A complete parallel pipeline (protocol, screening, extraction, risk of bias,
synthesis, PRISMA). The pipeline supports a meta-analysis design; running both means two
sets of artifacts and no working gate. Use its RoB and synthesis knowledge as reading, not
as a workflow."""

# ------------------------------------------------------------------------------
# GATED - useful inside a stage, must not become the stage
# ------------------------------------------------------------------------------

[[skill]]
name = "medical-sci-figure-skill"
verdict = "gated"
use_at = "S07 (choosing the archetype), S11 (writing the plot script)"
reason = """The figure standard for this machine, and the right thing to read at S11 - its atlas
covers wet-lab archetypes this pipeline handles thinly (dot-bar with SEM for n=3-8, paired
dot-line, violin/raincloud, Western blot panels, IHC/IF scale bars) and it carries a
GraphPad-Prism preset the pipeline has no equivalent of. Gated rather than allowed because
medfigure/recipes/ can render a figure: if it does, the output bypasses tools/figures/style.py
save(), so no sidecar is written, artist-level QC has nothing to read, and figures_qc_pass
cannot go green.

Use it as reading and as styling, not as the renderer. Concretely: take the archetype
definition, the mandatory-element list, the forbidden-construct list and the palette from the
skill; build the figure with tools/figures/style.py and tools/figures/recipes.py; judge it with
tools/figures/qc.py. See [figure_authority] above for the five numeric conflicts, all of which
resolve to the pipeline. Do not call medfigure.qa.audit_medical_figure() on a pipeline figure -
it flags the pipeline's own SubFigure panel titles as critical."""

[[skill]]
name = "check-reporting"
verdict = "gated"
use_at = "S12 reconcile, S19 polish"
reason = """Genuinely fills a gap: the pipeline records which reporting guideline applies but
never checks it item by item. Run it read-only against the manuscript and fix findings
through the normal stage edits. Do not let it rewrite sections."""

[[skill]]
name = "verify-refs"
verdict = "gated"
use_at = "S13, as a second opinion"
reason = """Audit-only, so it is safe, but it writes qc/reference_audit.json which no gate
reads. tools/pubmed/verify.py remains the authority for 06_refs/verified.json."""

[[skill]]
name = "calc-sample-size"
verdict = "gated"
use_at = "S03 protocol v1"
reason = "Fine for the power calculation; the result belongs in protocol_v1.md under 'Sample size / power'."

[[skill]]
name = "design-study"
verdict = "gated"
use_at = "S03, S06"
reason = """Its validity review (leakage, comparator design, analysis unit) is useful input to
the protocol. It must not become the protocol document."""

[[skill]]
name = "define-variables"
verdict = "gated"
use_at = "S03 protocol v1"
reason = "Literature-grounded variable definitions belong in protocol_v1.md under 'Variables'."

[[skill]]
name = "deidentify"
verdict = "gated"
use_at = "S04 data acquisition"
reason = """Runs locally with no network or LLM call, which is the right way to handle PHI.
Record what was removed in 02_data/provenance.md."""

[[skill]]
name = "generate-codebook"
verdict = "gated"
use_at = "S04 data acquisition"
reason = "Useful, provided the output lands at 02_data/codebook.md, which S04 declares."

[[skill]]
name = "clean-data"
verdict = "gated"
use_at = "S04 data acquisition"
reason = """Its cleaning code must be written into 03_analysis/code/ and write to
02_data/derived/. Raw files stay immutable."""

[[skill]]
name = "version-dataset"
verdict = "gated"
use_at = "S04 data acquisition"
reason = "Content hashing complements source_hash in dataset_summary.json rather than replacing it."

[[skill]]
name = "self-review"
verdict = "gated"
use_at = "after S19, before S20"
reason = """A pre-submission reviewer pass is valuable. Keep it read-only: it must not edit
the manuscript, and its R0 numbering scheme must not start a parallel revision workflow."""

[[skill]]
name = "lit-sync"
verdict = "gated"
use_at = "after S13"
reason = """Syncing to Zotero and Obsidian is fine one-way, out of 06_refs/. It must not
write back into refs.bib or library.json."""

[[skill]]
name = "batch-cohort"
verdict = "gated"
use_at = "S05 exploratory analysis"
reason = """Generating many analysis scripts from one template is legitimate, but each script
must dump to 03_analysis/results/*.json or its numbers have no provenance."""

[[skill]]
name = "replicate-study"
verdict = "gated"
use_at = "S03, S05"
reason = "Method extraction from a source paper is useful input; the generated code still has to meet the S05 contract."

[[skill]]
name = "cross-national"
verdict = "gated"
use_at = "S03, S05"
reason = "Harmonisation tables are useful; the analysis output still has to meet the S05 contract."

[[skill]]
name = "review-paper"
verdict = "gated"
use_at = "only for a narrative or scoping review, not an original article"
reason = """A different article type with a different skeleton. If the project is an original
research article, this competes with S07-S16. Confirm which you are writing."""

[[skill]]
name = "fill-protocol"
verdict = "gated"
use_at = "after S03, for the institutional IRB form"
reason = "Renders protocol content into a Word template. Source content comes from protocol_v1.md."

