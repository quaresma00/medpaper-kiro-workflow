check = "decision_recorded"
name = "submission_package_independent_audit"
allowed = ["PASS", "PASS_AUTHOR_FINAL_COPY"]
[[stage.gate]]
check = "final_copy_verified"
since = "1.9.0"

# ------------------------------------------------------------------------------
# Directories where the agent may legitimately create many files.
# Anything under project/ that matches neither a stage `outputs` entry nor one of
# these globs is reported by `wf clean` / the no_orphans check.
# ------------------------------------------------------------------------------
[freeform]
globs = [
  "00_input/*",
  "02_data/raw/**",
  "02_data/acquisition/**",
  "02_data/derived/*",
  "03_analysis/code/*",
  "03_analysis/results/*.json",
  "03_analysis/results/number_allowlist.tsv",
  # 1.10.0: variable crosswalk, raw spot check (+ its script), reference coverage and
  # uncited reasons, display reallocation, declarations assessment.
  "02_data/variable_crosswalk.json",
  "03_analysis/spot_check.json",
  "03_analysis/spot_check/*",
  "06_refs/coverage.json",
  "06_refs/uncited_reasons.json",
  "08_submission/display_reallocation.json",
  "08_submission/declarations_assessment.json",
  # 1.11.0: display dictionary and provisional journal presentation parameters (S07).
  "01_protocol/display_dictionary.json",
  "01_protocol/journal_profile.json",
  "03_analysis/reproducibility.toml",
  "04_tables/main/*.xlsx",
  "04_tables/supplementary/*.xlsx",
  "05_figures/code/*",
  "05_figures/out/*",
  "05_figures/qc/*",
  "06_refs/cache/**",
  "06_refs/fulltext/*",
  "06_refs/deepread/*.md",
  "07_manuscript/prepolish/*",
  "07_manuscript/polish_allowlist.tsv",
  # The journal-adaptation copy. Its contents are derived from the frozen scientific source, so
  # they are not stage outputs in their own right.
  "08_submission/manuscript/*",
  "08_submission/build_receipts/*",
  "07_manuscript/review_packages/*.zip",
  "08_submission/cache/**",
  "08_submission/*.csl",
  "08_submission/bundle/**",
  "08_submission/final_copy/**",
]

