# ==============================================================================
# medpaper pipeline - Single Source of Truth
# ==============================================================================
# This file is the ONLY authoritative definition of the workflow.
# The CLI (tools/wf.py) reads it; skill/steering files only point at the CLI.
# Parsed with stdlib tomllib (Python >= 3.11). Engine has no third-party deps.
#
# Editing rules:
#   - stage order == array order
#   - every artifact a stage produces MUST be listed in `outputs`
#     (drives: one-file-at-a-time enforcement, orphan scan, clean)
#   - gates are declarative; `check` names map to tools/wfcore/checks/*.py
# ==============================================================================

[meta]
name = "medpaper"
version = "1.11.0"
schema = 1
description = "Medical/clinical research pipeline: idea -> feasibility -> data -> analysis -> artifacts -> manuscript -> submission package."

[layout]
state_dir = ".wf"
temp_dir = "temp"

[layout.dirs]
"00_input" = "User-supplied inputs only: research idea md, author/affiliation info, raw uploads."
"01_protocol" = "Normalized idea, feasibility assessment, protocol v1/final, go-no-go records."
"02_data" = "raw/ (immutable), acquisition/ (retrieval code), derived/ (code-built only), acquisition_manifest.json, codebook.md, provenance.md."
"03_analysis" = "code/ (scripts), results/ (machine-readable JSON), analysis_log.md, notes.md."
"04_tables" = "main/ (one xlsx per main table), supplementary/ (single xlsx, one sheet per table)."
"05_figures" = "code/ (plot scripts), out/ (rendered png+tiff), qc/ (QC reports), legends.md."
"06_refs" = "refs.bib, refs.ris, library.json, verified.json, fulltext/, deepread/."
"07_manuscript" = "Section drafts, canonical full_manuscript.md, independent review, and front matter."
"08_submission" = "Journal shortlist, chosen journal guideline extract, final submission bundle, user confirmation and independent final audit."

# ------------------------------------------------------------------------------
# Global invariants. Printed by `wf status` on EVERY call so they survive
# context compaction. Keep short and absolute.
# ------------------------------------------------------------------------------
[policy]
invariants = [
  "Discovery helpers may find literature, but formal metadata must be freshly re-fetched through tools/pubmed/verify.py. A verified=true boolean is never evidence by itself: every citable key must pass the hashed raw-PubMed XML receipt, exact library hash, PMID/DOI match and independent live S13 EFetch gate. Never hand-write or patch library.json, verified.json, refs.bib or refs.ris to satisfy a gate.",
  "A hash proves that bytes did not change, never that they are the right paper. Every downloaded or registered full text must identify itself as the requested article - a structured identifier in JATS/HTML metadata, the library DOI present in a PDF, or a title you read off page one and recorded with `fulltext.py verify --confirm-identity`. Absent that, it counts as unproven, not as fine. Identifiers are read only from an article's own metadata: a descendant XML search sweeps in every cited reference's ArticleIdList, which is how a bibliography entry's PMCID once replaced the article's own and five deep reads landed on different papers with clean receipts.",
  "Acquire the complete protocol-defined data universe whenever the source makes it available. Never silently use LIMIT/TOP, head(), sample(), first-N slices, fixed page counts, date narrowing, or preview caps to save time, tokens, download volume or compute. A schema pilot is non-analytic and must be followed by full acquisition; every source needs machine-countable total and received receipts plus terminal-pagination proof. Replacing a census with scientific sampling and accepting source-imposed partial access each require the user's explicit recorded authorization. This gate cannot be waived with --force.",
  "Every number in the manuscript must already exist in 03_analysis/results/*.json, written there by executed code through write_results() (Python tools/analysis/results.py, R tools/R/medresults.R), which records the environment; S06 re-executes every analysis script in a sandbox and requires identical results, and S17, S23 and S25 re-check that proof against the current files. Never compute a statistic in your head or in prose.",
  "Draft scientific sections only at their active stages; the optional supplementary Methods file belongs only to S08. S17 then assembles the canonical full_manuscript.md from the completed, gated sections.",
  "Language polishing may change wording only. Never a number, never a citation, never a figure/table reference. A snapshot is taken before the pass and the gate diffs against it.",
  "Do not create files outside the stage's declared `outputs`. Scratch work goes in project/temp/ and is deleted before `wf advance`.",
  "A paper may never customise itself by editing pipeline/, tools/, reference/ or .kiro/ - those are the shared engine and any edit changes every other paper. Numeric/string targets belong in the paper's .wf/config.toml via `wf config set`; a genuine workflow-shape difference belongs in .wf/overrides.toml via `wf override init`. Every effective override is reprinted by `wf status`, completed-stage overrides are fingerprinted and cannot be changed retrospectively, and integrity gates plus review/audit stages can never be relaxed or skipped.",
  "`project/...` in a stage card is a logical alias for the paper folder printed by `wf status`. Run paper-authored Python/R with `wf run-script <paper-relative script>`; inside it derive the root from MEDPAPER_PROJECT or wfcore.paths.project_dir(), never from Path('project') or a literal project/ output. Standalone engine tools resolve the selected paper automatically.",
  "The engine directory is the mother workflow and never a paper. Papers live under the papers root (MEDPAPER_PAPERS_ROOT, ~/.medpaper/config.toml papers_root, default <engine parent>/medpaper_papers) and each is opened as its own Kiro workspace. Nothing resolves a paper inside the engine, no writer accepts an output inside it, `wf run-script` fails if a paper script touches it, and `wf doctor` reports any paper artifact found there as BROKEN.",
  "Figures are verified by looking at the rendered PNG, not by reading the plotting code. Deterministic QC (tools/figures/qc.py) runs every round in both modes and blocks at S11. The visual pass obeys visual_review_mode: inline = look at S10/S11; deferred = record DEFER there and discharge the entire backlog in ONE consolidated pass at S23 via the contact sheet, on final renders with the journal known. Deferring batches the look, it never cancels it - visual_debts_cleared is non-overridable, so no package ships unlooked-at. Never claim a visual check you did not perform.",
  "No explanatory prose inside figure panels. Explanation belongs in the figure legend.",
  "Do not draft or insert an AI-use disclosure unless the user explicitly requests that exact content; record journal requirements only as a user-controlled compliance item.",
  "Never upload patient-level, private or credential data to an external skill, plugin or service without explicit authorization.",
  "The S23 package is not final until S24 records the user's explicit request for final review and freezes the exact files, then S25 obtains one independent PASS from reader, editor and journal-compliance perspectives. Any post-confirmation change returns to S24.",
  "A user-requested revision never leaves the workflow and never rewinds by default. At S19/S24: `rework.py batch --plan` per feedback message (collects, builds nothing), `rework.py seal --why` once the user is done, edit only the files `rework.py status` lists, then `rework.py check` (only the affected stages' content gates; any file changed outside the scope fails), `mark`, `close`. Completed stages stay completed; wf advance/loop are refused while a scoped round is open. Full rewind is the explicit fallback only (`batch --rewind`, e.g. a journal switch). Science changed after S19 returns to S19 for re-review and re-freeze before the journal copy is merged. Word-only layout edits are allowed at S24 only when the S23 visible-text baseline is unchanged.",
  "The scientific record is frozen when the user releases S19 review, and 07_manuscript/ is read-only from then on. Journal requirements - word caps, abstract shape, reference style, title page, required statements - are presentation, and are applied to the copy in 08_submission/manuscript/ that S20 opens for the chosen journal. Switching journals first loops to S20 and runs reset-journal, which moves the entire old submission tree to 08_submission/journal_archives/<journal>-<UTC>/ (archived, never deleted, never read by a gate), then takes a fresh copy from the same frozen text; no prior cache, title page, cover letter, trim, bundle or approval may survive in the live tree. Once S19 is done a missing freeze fails the gate, and the freeze also covers 03_analysis/results/*.json. scientific_freeze_intact, journal_variant_ready and variant_preserves_science are non-overridable. Prose may be tightened to fit a cap, but a number, citation or artifact reference that disappears is dropped content, which is a scientific decision needing the user's recorded authorisation.",
  "Repeated feedback is handled as a persisted revision round at S19 (scientific manuscript) or S24 (journal package). Interpret each message once into atomic items, collect them into one round, seal once and build once; read and rebuild only the sealed dependency closure, preserve unaffected approved evidence, and still run every applicable quality gate (`rework build --scope full` at most twice per round). Token or context pressure is never permission to omit an item, shorten the scientific work or skip validation; resume from tools/rework.py status after compaction.",
  "Review points (S18/S19 manuscript, S24/S25 package) run as rounds: tools/review_round.py start, the read-only medpaper-reviewer subagent reads the printed current files, you apply on your own judgement the fixes that improve the paper (scoped rework where frozen science requires it), close the round, give the user ONE summary (findings by severity, changes file + one line, what was kept and why, pending author decisions) and ask one question: another round, or confirm. Findings on numbers, grouping/subgroups or strength of conclusions are changed or decided by the author, never kept on your preference. Approval is only the exact sentence '我确认这一版' (or 'I confirm this version'), recorded with the version hash; 'OK', '可以', '无需审阅', thanks or silence are not approval - ask for the sentence. No export package unless the user explicitly asks (review_round.py export), no per-change permission.",
  "Figures render in R by default (figure_engine); analysis may stay in Python. A figure drawn with the other engine needs `renderer` and a `renderer_reason` (>= 20 characters) in the artifact plan. Approved Python figures are kept as they are: never refit confirmed models just to render them in R. R figures carry a render receipt (script, result and output hashes); a changed script or result makes qc.py fail until the figure is re-rendered.",
  "Write for a clinician (1.11.0): internal names become the clinical labels of 01_protocol/display_dictionary.json in tables, in-figure text, legends and prose; no engineering language (strings, fields, parsed, snapshot, lines read, re-executed ...) outside Supplementary Methods; every table and figure defines its own abbreviations. An S19 return is never automatic: it needs the user's words '我确认回退'. Keep working state in the paper (temp/, .wf/progress.md), never in external temp folders.",
  "If you are unsure where you are, run `.\\.venv\\Scripts\\python.exe tools\\wf.py status`. Never guess the current stage.",
]

# `wf advance` refuses to move on unless the agent has recorded a handoff note.
handoff_required = true
# Files matching these globs are always allowed anywhere (never flagged as orphans).
always_allowed = [
  "**/.gitkeep",
  "**/README.md",
  "temp/**",
  ".wf/**",
  ".kiro/**",
  # Previous journals' variants and packages, moved aside (never deleted) on a journal switch.
  "08_submission/journal_archives/**",
  # The agent's own plans and check records (never deliverables, never round scope).
  "08_submission/notes/**",
]

# ------------------------------------------------------------------------------
# Per-project tunables. Override with the project venv: tools/wf.py config set KEY VALUE
# (stored in project/.wf/config.toml, which wins over these defaults)
# ------------------------------------------------------------------------------
[targets]
reflib_min = 45
reflib_max = 60
deepread_count = 5
intro_words_min = 450
intro_words_max = 750
intro_refs_min = 15
intro_refs_max = 30
discussion_words_min = 900
discussion_words_max = 1500
discussion_refs_min = 25
discussion_refs_max = 45
main_figures_max = 6
main_tables_max = 5
column_width_mm_single = 90.0
column_width_mm_double = 180.0
column_width_mm_1_5 = 140.0
# Which renderer S11 uses: "R" (default; tools/figures/R/medfig.R save_medpaper(), see
# reference/language_policy.toml) or "python" (tools/figures/style.py save()). qc.py judges
# both identically; a figure rendered with the other engine is a warning, not a failure.
figure_engine = "R"
figure_dpi_min = 300
# A passing independent live PubMed check is reused for this many hours by later live gates
# (bound to the hashed EFetch XML and re-compared per record). S13 and S25 always re-fetch.
live_reference_age_hours_max = 24
figure_font_pt_min = 6.0
figure_line_pt_min = 0.5
figure_legend_words_max = 180
# When the rendered-artifact look happens. Loading an image costs context, and the loop is
# what multiplies the cost: every re-render at S10/S11 re-loads the picture, and any later
# change upstream (S12 reconcile, S18/S19 review, S20 journal choice -> column width, palette)
# invalidates the look anyway.
#   "inline"    look at each artifact at the stage that renders it.
#   "deferred"  record DEFER at S10/S11 and discharge the whole backlog in ONE consolidated
#               pass at S23, on final renders, with the journal already known.
# Deferring moves the obligation, it never removes it: `visual_debts_cleared` is a
# non-overridable S23 gate. Deterministic QC (tools/figures/qc.py) is unaffected and still
# blocks at S11 in both modes - it is code, not eyes, so it is free to run every round.
visual_review_mode = "deferred"
# 1.11.0 (#2d): table footnotes are limited by total words (units, abbreviations, method in
# one sentence); method detail goes to Methods, diagnostics to a supplementary table.
table_footnote_words_max = 120
abbreviation_centralize_threshold = 8
abbreviation_local_words_max = 50
journal_source_age_days_max = 90
# Drafting budgets for S08-S17, before a journal is chosen (Word-compatible counts, numbers
# included). 1.10.0: soft while writing, a warning health check at S17; hard only from S20 on,
# against the chosen journal's typed limits in target_journal.json.
draft_main_words_max = 4000
draft_abstract_words_max = 250
# journal_limits_met (1.9.0): a count at or below the cap passes (margin 1.0 = 100%; a paper
# may lower it). Above journal_limit_warn_share of the cap is a warning only, because a
# portal's word counter rarely matches ours exactly.
journal_limit_margin = 1.0
journal_limit_warn_share = 0.97
# prose_not_lists (1.9.0): body sections are continuous paragraphs. More list items than this,
# or (with 2+ items) a larger share of the body's blocks, fails.
body_list_items_max = 3
body_list_share_max = 0.10
# Spelling system (1.9.0), decided at S01/S03: "american" (default for new papers, written to
# the paper config by `wf new`/`wf init`) or "british". Empty = undecided: table/figure text
# is left as written. A chosen journal's target_journal.json "spelling" takes precedence.
spelling = ""
reference_verification_age_days_max = 90

# ==============================================================================
# STAGES
# ==============================================================================

[[stage]]
id = "S01_intake"
title = "Intake: normalize the research idea"
card = "stages/S01_intake.md"
needs_user = true
outputs = ["01_protocol/idea.json", "03_analysis/notes.md"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "json_keys"
path = "01_protocol/idea.json"
keys = ["title_working", "design", "population", "exposure", "comparator", "outcomes", "claimed_novelty", "data_source_candidates", "open_questions"]
# 1.10.0: structured study design + data source, from which declarations are judged later.
[[stage.gate]]
check = "study_basis_recorded"
since = "1.10.0"
[[stage.gate]]
check = "no_future_artifacts"

[[stage]]
id = "S02_feasibility"
title = "Feasibility: real literature scan + publishability go/no-go #1"
card = "stages/S02_feasibility.md"
outputs = ["01_protocol/feasibility.md", "06_refs/cache/scan_manifest.json"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "pubmed_cache_fresh"
manifest = "06_refs/cache/scan_manifest.json"
min_queries = 3
min_hits = 20
[[stage.gate]]
check = "md_sections"
path = "01_protocol/feasibility.md"
headings = ["Search strategy", "What is already published", "Gap this study claims", "Saturation risk", "Verdict"]
[[stage.gate]]
check = "citekeys_resolve"
paths = ["01_protocol/feasibility.md"]
allow_unverified = true
[[stage.gate]]
check = "decision_recorded"
name = "go_nogo_1"
allowed = ["GO", "PIVOT", "STOP"]

[[stage]]
id = "S03_protocol"
title = "Protocol v1 + data source and acquisition plan"
card = "stages/S03_protocol.md"
outputs = ["01_protocol/protocol_v1.md", "02_data/acquisition_plan.md"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "md_sections"
path = "01_protocol/protocol_v1.md"
headings = ["Objective", "Design", "Population and eligibility", "Variables", "Statistical analysis plan", "Sample size / power", "Ethics"]
[[stage.gate]]
check = "design_precedent_recorded"
path = "01_protocol/protocol_v1.md"
[[stage.gate]]
check = "statistical_reporting_plan"
path = "01_protocol/protocol_v1.md"
since = "1.10.0"
[[stage.gate]]
check = "study_basis_recorded"
since = "1.10.0"
[[stage.gate]]
check = "md_sections"
path = "02_data/acquisition_plan.md"
headings = ["Source", "Access route", "Licence and ethics", "Protocol-defined data universe", "Exact retrieval steps", "Pagination and completeness proof", "Expected shape", "Known limitations"]

[[stage]]
id = "S04_data"
title = "Acquire data + codebook + provenance"
card = "stages/S04_data.md"
outputs = ["02_data/acquisition_manifest.json", "02_data/codebook.md", "02_data/provenance.md", "03_analysis/results/dataset_summary.json"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "file_count"
glob = "02_data/raw/**"
min = 1
[[stage.gate]]
check = "json_keys"
path = "03_analysis/results/dataset_summary.json"
keys = ["n_rows", "n_cols", "variables", "missingness", "source_hash", "acquisition_scope", "acquisition_status"]
[[stage.gate]]
check = "data_acquisition_complete"
# 1.10.0: full extraction guards quantity; the crosswalk guards definitions.
[[stage.gate]]
check = "variable_crosswalk_confirmed"
since = "1.10.0"
[[stage.gate]]
check = "results_have_environment"
[[stage.gate]]
check = "paper_scripts_scoped"
patterns = ["02_data/acquisition/**/*.py", "02_data/acquisition/**/*.R", "02_data/acquisition/**/*.r", "03_analysis/code/*.py", "03_analysis/code/*.R", "03_analysis/code/*.r"]
[[stage.gate]]
check = "temp_clean"

[[stage]]
id = "S05_analysis"
title = "Method scan + exploratory analysis (no figures)"
card = "stages/S05_analysis.md"
loopable = true
outputs = ["03_analysis/method_scan.md", "03_analysis/analysis_log.md"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "data_acquisition_complete"
[[stage.gate]]
check = "pubmed_cache_fresh"
manifest = "06_refs/cache/scan_manifest.json"
min_queries = 5
min_hits = 30
[[stage.gate]]
check = "file_count"
glob = "03_analysis/code/*.*"
min = 1
[[stage.gate]]
check = "file_count"
glob = "03_analysis/results/*.json"
min = 2
[[stage.gate]]
check = "no_plot_calls"
glob = "03_analysis/code/*.*"
[[stage.gate]]
check = "notes_populated"
path = "03_analysis/notes.md"
headings = ["Introduction points", "Discussion points", "Limitations", "Surprises / must-not-forget"]
[[stage.gate]]
check = "paper_scripts_scoped"
patterns = ["03_analysis/code/**/*.py", "03_analysis/code/**/*.R", "03_analysis/code/**/*.r"]
[[stage.gate]]
check = "results_have_environment"
[[stage.gate]]
check = "temp_clean"

[[stage]]
id = "S06_protocol_final"
title = "Refine protocol from findings + publishability go/no-go #2"
card = "stages/S06_protocol_final.md"
outputs = ["01_protocol/protocol_final.md", "01_protocol/protocol_diff.md", "03_analysis/reproducibility_report.json"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "data_acquisition_complete"
[[stage.gate]]
check = "results_have_environment"
# S06 re-executes every analysis script in a sandbox (tools/reproduce.py run); the results
# must be identical. Re-checked at S17, S23 and S25 against the current files.
[[stage.gate]]
check = "analysis_reproduces"
[[stage.gate]]
check = "md_sections"
path = "01_protocol/protocol_final.md"
headings = ["Objective", "Design", "Population and eligibility", "Variables", "Statistical analysis plan", "Sample size / power", "Ethics", "Deviations from protocol v1"]
[[stage.gate]]
check = "design_precedent_recorded"
path = "01_protocol/protocol_final.md"
[[stage.gate]]
check = "statistical_reporting_plan"
path = "01_protocol/protocol_final.md"
since = "1.10.0"
[[stage.gate]]
check = "raw_spot_check"
since = "1.10.0"
[[stage.gate]]
check = "decision_recorded"
name = "analysis_converged"
allowed = ["YES"]
[[stage.gate]]
check = "decision_recorded"
name = "go_nogo_2"
allowed = ["GO", "PIVOT", "STOP"]

[[stage]]
id = "S07_artifacts"
title = "Artifact inventory (benchmarked vs comparable papers) + legends"
card = "stages/S07_artifacts.md"
outputs = ["01_protocol/artifact_plan.json", "05_figures/legends.md", "04_tables/table_captions.md", "01_protocol/artifact_benchmark.md"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "json_keys"
path = "01_protocol/artifact_plan.json"
keys = ["main_figures", "main_tables", "supp_figures", "supp_tables", "supp_files"]
[[stage.gate]]
check = "artifact_plan_sane"
path = "01_protocol/artifact_plan.json"
[[stage.gate]]
check = "pubmed_cache_fresh"
manifest = "06_refs/cache/scan_manifest.json"
min_queries = 6
min_hits = 30
[[stage.gate]]
check = "md_sections"
path = "01_protocol/artifact_benchmark.md"
headings = ["Comparable papers surveyed", "Figure/table counts observed", "Chosen inventory and why"]
[[stage.gate]]
check = "legends_cover_plan"
[[stage.gate]]
check = "figure_text_planned"
since = "1.10.0"
# 1.11.0: internal name -> clinical label, abbreviation, definition; legends/captions use it.
[[stage.gate]]
check = "display_dictionary_ready"
since = "1.11.0"
[[stage.gate]]
check = "clinical_labels_used"
paths = ["05_figures/legends.md", "04_tables/table_captions.md"]
since = "1.11.0"
[[stage.gate]]
check = "engineering_language_clean"
paths = ["05_figures/legends.md", "04_tables/table_captions.md"]
since = "1.11.0"
[[stage.gate]]
check = "provisional_journal_params"
since = "1.11.0"
[[stage.gate]]
check = "legend_no_results_restatement"
[[stage.gate]]
check = "forbidden_symbols_absent"
paths = ["05_figures/legends.md", "04_tables/table_captions.md"]

[[stage]]
id = "S08_methods"
title = "Write Methods"
card = "stages/S08_methods.md"
outputs = ["07_manuscript/methods.md", "07_manuscript/supplementary_methods.md"]
[[stage.gate]]
check = "outputs_exist"
optional = ["07_manuscript/supplementary_methods.md"]
[[stage.gate]]
check = "single_section_written"
[[stage.gate]]
check = "citekeys_resolve"
paths = ["07_manuscript/methods.md", "07_manuscript/supplementary_methods.md"]
# 1.10.0: every Methods citation is checked live against PubMed when it is written.
[[stage.gate]]
check = "reference_provenance"
live = true
cited_in = ["07_manuscript/methods.md", "07_manuscript/supplementary_methods.md"]
since = "1.10.0"
[[stage.gate]]
check = "supplementary_methods_clean"
[[stage.gate]]
check = "numbers_have_provenance"
path = "07_manuscript/methods.md"
[[stage.gate]]
check = "numbers_have_provenance"
path = "07_manuscript/supplementary_methods.md"
optional = true
[[stage.gate]]
check = "no_ai_boilerplate"
path = "07_manuscript/methods.md"
[[stage.gate]]
check = "prose_not_lists"
path = "07_manuscript/methods.md"
since = "1.9.0"
# 1.11.0: Methods state principles; implementation detail -> Supplementary Methods (warning).
[[stage.gate]]
check = "engineering_language_clean"
paths = ["07_manuscript/methods.md"]
since = "1.11.0"
[[stage.gate]]
check = "clinical_labels_used"
paths = ["07_manuscript/methods.md"]
since = "1.11.0"
[[stage.gate]]
check = "no_ai_boilerplate"
path = "07_manuscript/supplementary_methods.md"
optional = true

[[stage]]
id = "S10_tables"
title = "Build tables (three-line xlsx, reader-facing)"
card = "stages/S10_tables.md"
outputs = ["04_tables/code/build_tables.py", "04_tables/manifest.json"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "tables_match_plan"
[[stage.gate]]
check = "tables_threeline"
[[stage.gate]]
check = "numbers_have_provenance"
source = "tables"
# 1.11.0: clinical labels, no engineering language, presentation standard, concise footnotes.
[[stage.gate]]
check = "clinical_labels_used"
displays = "tables"
since = "1.11.0"
[[stage.gate]]
check = "engineering_language_clean"
displays = "tables"
since = "1.11.0"
[[stage.gate]]
check = "display_values_presented"
displays = "tables"
since = "1.11.0"
[[stage.gate]]
check = "table_footnotes_concise"
since = "1.11.0"
[[stage.gate]]
check = "paper_scripts_scoped"
patterns = ["04_tables/code/**/*.py", "04_tables/code/**/*.R", "04_tables/code/**/*.r"]
[[stage.gate]]
check = "temp_clean"
[[stage.gate]]
check = "visual_confirmation"
name = "tables_visually_confirmed"
artifact = "rendered tables"

[[stage]]
id = "S11_figures"
title = "Render figures + deterministic QC + visual verification loop"
card = "stages/S11_figures.md"
outputs = ["05_figures/manifest.json", "05_figures/qc/qc_report.json", "05_figures/moved_to_legend.md"]
[[stage.gate]]
check = "outputs_exist"
[[stage.gate]]
check = "figures_match_plan"
[[stage.gate]]
check = "figures_qc_pass"
